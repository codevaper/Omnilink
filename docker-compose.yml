

services:

  # ---------------------------------------------------------
  # KAFKA (KRaft mode — no Zookeeper container needed)
  # This is our Event Bus: department systems publish events
  # here (e.g. "application.submitted"), and the workflow /
  # tracker services subscribe to them.
  # ---------------------------------------------------------
  kafka:
    image: bitnamilegacy/kafka:3.7.0
    container_name: omnilink-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Web UI to see topics/messages flowing — useful for
  # debugging and for showing judges "look, real events".
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: omnilink-kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=omnilink
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  # ---------------------------------------------------------
  # MONGODB — simulates the "Municipal Records" department
  # (a modern NoSQL system, deliberately different shape from
  # the Ration Card SQL data)
  # ---------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: omnilink-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=omnilinkadmin
      - MONGO_INITDB_ROOT_PASSWORD=omnilinkpass123
      - MONGO_INITDB_DATABASE=municipal_records
    volumes:
      - mongo_data:/data/db

  # ---------------------------------------------------------
  # POSTGRES — simulates the "Ration Card" department
  # (a legacy relational system with messy column names —
  # this is what our AI mapper will clean up later)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: omnilink-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=omnilinkadmin
      - POSTGRES_PASSWORD=omnilinkpass123
      - POSTGRES_DB=ration_card_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnilinkadmin -d ration_card_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # CAMUNDA 7 — the workflow orchestration engine.
  # Uses the "run" distribution (Spring Boot based) with its
  # built-in H2 database — no separate DB needed for Camunda
  # itself, keeps this simple for a hackathon build.
  # ---------------------------------------------------------
  camunda:
    image: camunda/camunda-bpm-platform:run-7.24.0
    container_name: omnilink-camunda
    ports:
      - "8080:8080"
    volumes:
      - camunda_data:/camunda/data

volumes:
  kafka_data:
  mongo_data:
  postgres_data:
  camunda_data: